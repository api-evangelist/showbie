name: Showbie
description: >-
  Showbie is a K-12 learning platform for iPad that streamlines teaching
  workflows across assignments, feedback, grading, and classroom communication
  for teachers, students, and parents. Backed by Point Nine, it combines a
  digital classroom, annotation and file-sharing tools, and messaging into a
  single app used by schools worldwide. Showbie exposes no public developer
  API, SDK, or docs surface; this profile captures the company's public web,
  support, compliance, privacy, and terms properties, plus a live domain
  security probe.
